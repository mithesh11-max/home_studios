[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all routes serve index.html (status 200, not 301/302)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-lived cache for hashed assets (Vite content-addresses all JS/CSS/images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No-cache for HTML (always fresh so new deploys are picked up immediately)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
